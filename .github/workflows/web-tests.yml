name: Hosted web safety checks

on:
  push:
    branches: [web-deployment]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install hosted dependencies
        run: python -m pip install -r requirements-web.txt
      - name: Compile Python source
        run: python -m py_compile web_preview.py web_points.py web_geospatial.py geoid_engine.py vertical_reference.py
      - name: Run hosted smoke tests
        run: python -m unittest discover -s tests -v
