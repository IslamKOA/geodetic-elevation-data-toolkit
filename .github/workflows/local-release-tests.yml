name: Local scientific release checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-raf20:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scientific dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Linux/macOS installer Bash syntax
        run: bash -n INSTALL_LINUX_MAC_AUTO.sh
      - name: Check Windows installer PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/INSTALL_WINDOWS_AUTO.ps1", [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Compile Python code
        run: python -m py_compile geoid_web.py geoid_engine.py vertical_reference.py global_dem_downloader.py ign_lidarhd_downloader.py
      - name: Check ElevDatum UI branding and launch behavior
        run: python -m unittest discover -s tests -p 'test_elevdatum_ui_branding.py'
      - name: Test original RAF20 engine
        run: python release_smoke_test.py
